<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="陪一个女孩从七岁走到三十岁：三时段日程、地图探索、商店送礼、爱好养成、回忆碎片图鉴，名字由你来取。">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌞</text></svg>">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;background:#FFF8EE}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>伴她长大</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Baloo+2:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --cream:#FFF8EE; --paper:#FFFFFF; --soft:#FFF2E2; --soft2:#FFE8D2;
  --pink:#FFD9E3; --pink2:#F2789E; --sky:#D6EAF8; --sky2:#5BA7D9;
  --orange:#FF9A52; --gold:#F5B82E; --mint:#CDEBDC; --mint2:#4FAE86;
  --ink:#4B3A32; --ink2:#7A6558; --ink3:#A7948A;
  --line:#F0E0CC; --line2:#E4CFB4;
  --bad:#C9564C; --bad2:#F7DEDA; --cool:#7D93A8;
  --r:14px; --rs:10px;
  --sh:0 10px 28px -18px rgba(120,85,50,.55);
  --sh2:0 2px 0 rgba(255,255,255,.9) inset, 0 12px 30px -20px rgba(120,85,50,.6);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;
  background-image:
    radial-gradient(900px 420px at 88% -10%, rgba(255,217,227,.55), transparent 62%),
    radial-gradient(760px 420px at 4% 8%, rgba(214,234,248,.5), transparent 60%),
    radial-gradient(700px 400px at 50% 108%, rgba(245,184,46,.18), transparent 64%);
  background-attachment:fixed}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px;padding-block:0 92px}

/* ===== 顶部状态栏 ===== */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 -16px 0;padding:9px 16px;
  background:rgba(255,248,238,.93);backdrop-filter:blur(12px);border-bottom:2px solid var(--line)}
.tb{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--paper);border:1.5px solid var(--line2);
  border-radius:99px;padding:3px 11px;font-size:12px;color:var(--ink2);box-shadow:0 2px 0 rgba(228,207,180,.5)}
.pill b{font-family:"Baloo 2","ZCOOL QingKe HuangYou",cursive;font-size:16px;color:var(--ink);line-height:1}
.pill.day{background:linear-gradient(180deg,#FFF,var(--soft));border-color:var(--gold)}
.pill.age{background:linear-gradient(180deg,#FFF7E2,#FFE9BC);border-color:var(--gold)}
.pill.coin{background:linear-gradient(180deg,#FFFBEA,#FFF0C2);border-color:#E9C45E;color:#8A6A14}
.pill.coin b{color:#8A6A14}
.pill.mood{background:var(--paper)}
.pill.stage{background:linear-gradient(180deg,#FFF,var(--pink));border-color:#F3BCCB;color:#9C4A63}
.pill.season{background:linear-gradient(180deg,#FFF,var(--sky));border-color:#AFD4EC;color:#2E6B95}
.spine{display:flex;gap:3px;margin-top:8px}
.spine i{height:5px;flex:1;background:#F2E3D0;border-radius:99px;position:relative;overflow:hidden}
.spine i.done{background:var(--line2)}
.spine i.now::after{content:"";position:absolute;inset:0;width:var(--p,0%);
  background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:99px}

/* ===== 三栏布局 ===== */
.game{display:grid;grid-template-columns:208px minmax(0,1fr) 220px;gap:14px;margin-top:14px;align-items:start}
@media(max-width:900px){.game{grid-template-columns:1fr;gap:11px}}

.panel{background:var(--paper);border:2px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden}
.phead{font-size:11px;letter-spacing:.14em;color:var(--ink3);padding:9px 13px 0;font-weight:500}
.pbody{padding:11px 13px 13px}

/* 人物卡 */
.chcard{text-align:center}
.chcard .frame{background:linear-gradient(170deg,var(--sky),var(--pink));padding:12px 10px 0;position:relative}
.chcard .frame::after{content:"";position:absolute;inset:auto 0 0 0;height:22px;
  background:linear-gradient(180deg,transparent,var(--paper))}
.pt{display:block;margin:0 auto;position:relative;z-index:1;filter:drop-shadow(0 8px 14px rgba(120,85,50,.25))}
.chname{font-family:"ZCOOL QingKe HuangYou",cursive;font-size:21px;margin-top:4px}
.chsub{font-size:11.5px;color:var(--ink3);margin-top:-2px}
.chdesc{font-size:12px;color:var(--ink2);line-height:1.65;margin-top:8px;text-align:left;
  background:var(--soft);border-radius:var(--rs);padding:8px 10px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px;justify-content:center}
.tag{font-size:10.5px;background:var(--soft2);border:1px solid var(--line2);color:#9A6B3C;
  border-radius:99px;padding:1px 8px}
.tag.p{background:var(--pink);border-color:#F3BCCB;color:#9C4A63}
.tag.s{background:var(--sky);border-color:#AFD4EC;color:#2E6B95}

/* 属性条 */
.stat{margin-bottom:9px}
.stat .l{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink2)}
.stat .l b{font-family:"Baloo 2",monospace;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .l .dt{font-size:10px;margin-left:3px}
.stat .t{height:9px;border-radius:99px;background:#F3E6D6;overflow:hidden;margin-top:3px;position:relative;
  border:1px solid rgba(0,0,0,.04)}
.stat .f{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
.grp{font-size:10px;letter-spacing:.16em;color:var(--ink3);margin:3px 0 7px;display:flex;align-items:center;gap:7px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.up{color:var(--mint2)}.dn{color:var(--bad)}

/* ===== 中间舞台 ===== */
#stage{min-height:260px}
.band{display:block;width:100%;height:86px}
.sbody{padding:14px 16px 16px}
.scenetag{display:inline-block;font-size:11px;background:var(--soft);border:1px solid var(--line2);
  border-radius:99px;padding:1px 10px;color:var(--ink2);margin-bottom:9px}
.story{font-size:15px;line-height:1.95;color:var(--ink)}
.story b{color:var(--pink2)}
.say{display:flex;gap:10px;margin-top:13px;align-items:flex-start}
.ava{flex:0 0 42px;height:42px;border-radius:50%;overflow:hidden;background:linear-gradient(170deg,var(--sky),var(--pink));
  box-shadow:0 4px 10px -5px rgba(120,85,50,.6)}
.bub{background:var(--soft);border:1.5px solid var(--line2);border-radius:4px 14px 14px 14px;
  padding:10px 14px;font-size:15px;line-height:1.85;max-width:100%}
.me{justify-content:flex-end}
.me .bub{background:var(--sky);border-color:#AFD4EC;border-radius:14px 4px 14px 14px}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:var(--rs);
  padding:11px 14px;cursor:pointer;font:inherit;font-size:14.5px;color:var(--ink);transition:.16s;
  display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;touch-action:manipulation}
.opt .k{font-family:"Baloo 2",monospace;font-size:12px;color:var(--orange)}
.opt .tx{grid-column:2;grid-row:1}
.opt .tag2{grid-column:2;font-size:10.5px;color:var(--ink3)}
@media(hover:hover){.opt:hover{border-color:var(--orange);background:var(--soft);transform:translateY(-1px);
  box-shadow:0 8px 18px -14px rgba(255,154,82,.95)}}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt[disabled]{opacity:.5;cursor:default}
.opt.picked{border-color:var(--orange);background:var(--soft2)}

/* ===== 底部菜单 ===== */
.menu{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,248,238,.96);
  backdrop-filter:blur(12px);border-top:2px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.menuin{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media(max-width:700px){.menuin{grid-template-columns:repeat(4,1fr)}}
.mb{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:6px 2px 5px;
  font:inherit;font-size:11px;color:var(--ink2);cursor:pointer;transition:.16s;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25}
.mb i{font-style:normal;font-size:17px}
@media(hover:hover){.mb:hover{border-color:var(--orange);background:var(--soft);color:var(--ink)}}
.mb.on{border-color:var(--orange);background:var(--soft2);color:#9A5A1E}
.mb[disabled]{opacity:.42;cursor:default}

/* ===== 通用块 ===== */
.btn{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(180deg,#FFB877,var(--orange));
  border:none;color:#fff;padding:11px 24px;border-radius:99px;font:inherit;font-size:14px;font-weight:500;
  cursor:pointer;transition:.16s;margin-top:14px;box-shadow:0 6px 16px -8px rgba(255,154,82,.9);touch-action:manipulation}
@media(hover:hover){.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}}
.btn.g{background:linear-gradient(180deg,#8FD3B5,var(--mint2));box-shadow:0 6px 16px -8px rgba(79,174,134,.9)}
.btn.w{background:var(--paper);color:var(--ink2);border:2px solid var(--line2);box-shadow:none}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}

.note{border-radius:var(--rs);padding:9px 13px;margin-top:12px;font-size:13px;border:1.5px solid}
.note.y{background:#FFF6DC;border-color:#EFD796;color:#8A6A14}
.note.p{background:#FFF0F4;border-color:#F3BCCB;color:#9C4A63}
.note.b{background:#EEF7FD;border-color:#AFD4EC;color:#2E6B95}
.note.r{background:var(--bad2);border-color:#E9B6AF;color:#A33E35}
.note.g{background:#EDF8F2;border-color:#B6E0CB;color:#2F7A58}

/* 栅格卡（活动/商店/地图/图鉴） */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-top:12px}
.gc{background:var(--paper);border:2px solid var(--line);border-radius:var(--rs);padding:11px 12px;
  cursor:pointer;font:inherit;color:var(--ink);text-align:left;transition:.16s;display:flex;flex-direction:column;gap:5px;
  touch-action:manipulation}
@media(hover:hover){.gc:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 10px 20px -16px rgba(255,154,82,1)}}
.gc[disabled]{opacity:.45;cursor:default;transform:none}
.gc .n{font-size:14.5px;display:flex;align-items:center;gap:6px}
.gc .n em{font-style:normal;font-size:17px}
.gc .d{font-size:11.5px;color:var(--ink3);line-height:1.5;flex:1}
.gc .fx{display:flex;flex-wrap:wrap;gap:4px}
.gc .price{font-family:"Baloo 2",monospace;font-size:13px;color:#8A6A14;background:#FFF4D4;
  border:1px solid #EFD796;border-radius:99px;padding:0 8px;align-self:flex-start}
.gc .stars{font-size:11px;color:var(--gold);letter-spacing:1px}
.eff{font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid}
.eff.u{background:#EDF8F2;border-color:#B6E0CB;color:#2F7A58}
.eff.d{background:var(--bad2);border-color:#E9B6AF;color:#A33E35}

/* 日程三时段 */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
@media(max-width:560px){.slots{grid-template-columns:1fr}}
.slot{border:2px dashed var(--line2);border-radius:var(--rs);padding:10px 11px;background:var(--soft);min-height:74px}
.slot.filled{border-style:solid;background:var(--paper);border-color:var(--orange)}
.slot .h{font-size:11px;color:var(--ink3);letter-spacing:.1em}
.slot .v{font-size:14px;margin-top:3px}
.slot .v.e{color:var(--ink3)}
.slot.cur{box-shadow:0 0 0 3px rgba(245,184,46,.35)}

/* 爱好 */
.hb{background:var(--paper);border:2px solid var(--line);border-radius:var(--rs);padding:11px 13px;margin-top:9px}
.hb .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hb .lv{font-size:11.5px;color:#9A5A1E;background:var(--soft2);border:1px solid var(--line2);border-radius:99px;padding:0 9px}
.hb .t{height:8px;border-radius:99px;background:#F3E6D6;overflow:hidden;margin-top:6px}
.hb .f{height:100%;background:linear-gradient(90deg,var(--gold),var(--orange))}
.hb .sk{font-size:11.5px;color:var(--ink3);margin-top:5px}

/* 碎片 */
.fc{background:var(--paper);border:2px solid var(--line);border-radius:var(--rs);padding:11px 12px;cursor:pointer;
  font:inherit;color:var(--ink);text-align:left;transition:.16s;min-height:76px;touch-action:manipulation}
.fc .r{font-size:9.5px;letter-spacing:.14em;font-family:"Baloo 2",monospace}
.fc .t{font-size:13.5px;margin-top:4px;line-height:1.45}
.fc.lock{opacity:.4;cursor:default;background:var(--soft)}
.fc.n{border-color:var(--line2)} .fc.n .r{color:var(--ink3)}
.fc.r2{border-color:var(--gold);background:linear-gradient(160deg,#FFF9E6,var(--paper))} .fc.r2 .r{color:#B8860B}
.fc.r3{border-color:var(--pink2);background:linear-gradient(160deg,#FFF0F5,var(--paper));
  box-shadow:0 6px 18px -12px rgba(242,120,158,.9)} .fc.r3 .r{color:var(--pink2)}
@media(hover:hover){.fc:not(.lock):hover{transform:translateY(-2px)}}
.fstory{background:var(--soft);border-left:4px solid var(--gold);border-radius:0 var(--rs) var(--rs) 0;
  padding:13px 16px;margin-top:14px;font-size:15px;line-height:2}

/* 弹窗 */
.mask{position:fixed;inset:0;z-index:60;background:rgba(75,58,50,.42);backdrop-filter:blur(3px);
  display:grid;place-items:center;padding:18px}
.modal{background:var(--paper);border:3px solid var(--gold);border-radius:18px;max-width:460px;width:100%;
  box-shadow:0 30px 60px -28px rgba(90,60,30,.7);overflow:hidden;max-height:86vh;overflow-y:auto}
.modal .mh{background:linear-gradient(180deg,#FFF3D6,#FFE6B8);padding:11px 16px;font-size:14px;color:#8A6A14;
  border-bottom:2px solid #EFD796;display:flex;align-items:center;gap:7px}
.modal .mb2{padding:14px 16px 16px}
.modal.bad{border-color:#E9B6AF}.modal.bad .mh{background:linear-gradient(180deg,#FDECEA,#F9DAD6);color:#A33E35;border-bottom-color:#E9B6AF}
.modal.good{border-color:#B6E0CB}.modal.good .mh{background:linear-gradient(180deg,#EDF8F2,#DBF0E5);color:#2F7A58;border-bottom-color:#B6E0CB}

/* 开场 */
h1{font-family:"ZCOOL QingKe HuangYou",cursive;font-size:44px;font-weight:400;margin:26px 0 8px;line-height:1.2}
h1 small{display:block;font-family:"Noto Sans SC";font-size:12px;font-weight:300;letter-spacing:.3em;color:var(--orange);margin-bottom:10px}
h2{font-family:"ZCOOL QingKe HuangYou",cursive;font-size:26px;font-weight:400;margin:0 0 6px}
.lede{color:var(--ink2);font-size:14.5px;max-width:42em}
.nameform{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.nameform input{background:var(--paper);border:2px solid var(--line2);border-radius:12px;color:var(--ink);
  font-family:"ZCOOL QingKe HuangYou",cursive;font-size:20px;padding:10px 16px;width:220px;max-width:100%;text-align:center}
.nameform input:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.nameform .btn{margin-top:0}
.hint{font-size:12px;color:var(--ink3);margin-top:8px}
.qnum{font-size:11px;letter-spacing:.16em;color:var(--orange);font-family:"Baloo 2",monospace}
.qtxt{font-size:19px;line-height:1.7;margin:7px 0 2px}
.prog{display:flex;gap:4px;margin-top:14px}
.prog i{height:4px;flex:1;background:#F3E6D6;border-radius:99px}
.prog i.on{background:linear-gradient(90deg,var(--orange),var(--gold))}

/* 结算 */
.gradebox{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;margin:10px 0 4px}
.grade{font-family:"Baloo 2",cursive;font-size:62px;line-height:1;width:104px;height:104px;border-radius:26px;
  display:grid;place-items:center;color:#fff;box-shadow:0 14px 30px -16px rgba(0,0,0,.5)}
.grade.S{background:linear-gradient(160deg,#FFD66B,#F09A2C)}
.grade.A{background:linear-gradient(160deg,#9BD9B6,#4FAE86)}
.grade.B{background:linear-gradient(160deg,#AFD4EC,#5BA7D9)}
.grade.C{background:linear-gradient(160deg,#E7C9E0,#B07AA6)}
.grade.D{background:linear-gradient(160deg,#B6C4D2,#7D93A8)}
.grade.E{background:linear-gradient(160deg,#E9A79F,#C9564C)}
.kw{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:12px}
.kwc{background:var(--soft);border:1.5px solid var(--line2);border-radius:var(--rs);padding:9px 12px}
.kwc .k{font-size:11px;color:var(--ink3)}
.kwc .v{font-size:14.5px;margin-top:1px}
.fin{background:var(--soft);border-left:4px solid var(--pink2);border-radius:0 var(--rs) var(--rs) 0;
  padding:14px 17px;margin-top:16px;font-size:15.5px;line-height:2;text-align:left}

#fx{position:fixed;inset:0;pointer-events:none;z-index:900;overflow:hidden;contain:strict}
#fx span{position:absolute;left:0;top:0;will-change:transform,opacity;line-height:1;user-select:none}
#fx .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 25%,transparent 38%,rgba(125,147,168,.3) 100%)}
.fade{animation:fu .38s cubic-bezier(.2,.8,.3,1) both}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:pp .34s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pp{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.foot{margin-top:22px;color:var(--ink3);font-size:11.5px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lnk{color:var(--ink3);background:none;border:0;font:inherit;font-size:11.5px;text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;padding:0}
@media(hover:hover){.lnk:hover{color:var(--orange)}}
details{margin-top:14px;border-top:2px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-size:12.5px;color:var(--ink3)}
details ul{margin:9px 0 0;padding-left:18px;color:var(--ink2);font-size:12.5px;line-height:1.9}

@media(max-width:900px){
  .chcard{display:grid;grid-template-columns:120px 1fr;gap:0}
  .chcard .frame{padding:10px 6px 0}
  .chcard .frame::after{display:none}
  .chcard .pbody{padding:11px 13px}
  .chname{margin-top:0;text-align:left}.chsub{text-align:left}.tags{justify-content:flex-start}
}
@media(max-width:480px){
  .wrap{padding:0 12px;padding-block:0 88px}
  .topbar{margin:0 -12px;padding:8px 12px}
  .pill{font-size:11px;padding:2px 9px}.pill b{font-size:14px}
  h1{font-size:34px}
  .band{height:68px}.sbody{padding:13px 13px 14px}
  .story{font-size:14.5px}.bub{font-size:14.5px;padding:9px 12px}
  .ava{flex:0 0 36px;height:36px}
  .opt{padding:12px 13px;font-size:14px}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .gc{padding:10px}
  .mb{font-size:10px}.mb i{font-size:16px}
  .grade{font-size:50px;width:86px;height:86px}
  .chcard{grid-template-columns:104px 1fr}
}
.ava svg{width:100%;height:100%;display:block}
.chcard .frame svg{max-width:100%}
</style>

<div id="fx" aria-hidden="true"></div>
<div class="wrap">
  <div class="topbar" id="topbar" hidden></div>
  <div class="game">
    <div id="charcard"></div>
    <div id="stage"></div>

/* ============ 回忆碎片图鉴 ============ */
const FRAG=[
 {id:"f101",n:"第一张贴在冰箱上的画",r:1,st:1,t:"那张画其实画歪了，左边那只鸟没有脚。但你把它贴在了冰箱最中间，正对着门。她每天出门前都要看一眼。很多年后她说，那是她第一次觉得自己做的东西是值得被挂起来的。"},
 {id:"f102",n:"被念错的名字",r:1,st:1,t:"开学点名，老师把她的名字念错了。全班笑了。她跟着笑，回家才哭。她没告诉任何人她哭过——除了你，而你当时假装没看见，只是把她的名字一笔一画写在了练习本封面上。"},
 {id:"f103",n:"升旗仪式前一晚",r:2,st:1,t:"她被选去升旗仪式上发言。前一晚她在房间里对着墙练了四十七遍。你在门外听完了全部四十七遍，第二天早上什么也没说，只是把她的红领巾熨平了。"},
 {id:"f104",n:"藏起来的那张卷子",r:2,st:1,t:"六十七分。她把卷子折成很小一块塞进书包夹层，整整三天。被发现那天她以为你会骂，你只说了一句：“这三天你一个人扛得很辛苦吧。”她那天哭得比考砸还凶。"},
 {id:"f105",n:"她想当的第一个职业",r:3,st:1,t:"七岁那年她认真宣布：长大要当主持人。因为“主持人说话的时候，所有人都会看着她”。这个愿望她后来再没提过，但你一直记得她说这句话时眼睛的样子。"},
 {id:"f106",n:"运动会的最后一名",r:1,st:1,t:"八百米她跑了最后一名，但她坚持跑完了。全场只剩下她一个人在跑道上。她说那一刻她听见有人在喊她名字——她一直以为是幻觉，其实是你。"},
 {id:"f107",n:"把零花钱换成的东西",r:2,st:1,t:"她攒了两个月零花钱，买了一个很丑的马克杯送你。售货员说这个颜色不好卖。她说“可是这个最像太阳”。"},
 {id:"f201",n:"第一次锁上的门",r:1,st:2,t:"十三岁那年她开始锁门。不是因为有秘密，是因为她突然发现自己需要一个地方，可以不好看、不开朗、不用对谁负责。"},
 {id:"f202",n:"镜子前的四十分钟",r:1,st:2,t:"她开始在镜子前站很久。她不是在臭美，她是在确认：这张脸能不能让她在学校里安全地活着。"},
 {id:"f203",n:"没送出去的那封信",r:2,st:2,t:"信写了三页，改了九遍，最后夹在课本里一直到毕业。她后来说：其实我不是怕他拒绝，我是怕全班都知道我被拒绝了。"},
 {id:"f204",n:"被传开的外号",r:2,st:2,t:"一个很难听的外号在年级里传了两个月。她每天照常笑着上学。只有你发现她把那两个月的日记全部撕掉了。"},
 {id:"f205",n:"她第一次说“我也可以”",r:3,st:2,t:"那次演讲比赛她本来没报名。是你随口说了一句“你讲话挺好听的”。她愣了很久，然后说：“……那我也可以试试吗。”她拿了二等奖，奖状至今压在玻璃板下面。"},
 {id:"f206",n:"凌晨一点的台灯",r:1,st:2,t:"她假装睡了，等你走了再把台灯打开。不是为了学习，是为了看完那本小说。那是她那段时间唯一能呼吸的地方。"},
 {id:"f301",n:"倒计时牌背面",r:1,st:3,t:"高考倒计时牌正面写着天数，背面她用铅笔很小地写了一句：“撑住，你以后会很酷的。”写完又用橡皮擦淡了一点，怕被人看见。"},
 {id:"f302",n:"第一次说不想考",r:2,st:3,t:"她哭着说不想考了。你没有说“坚持一下”，你说“那我们聊聊不考会怎样”。聊到两点，她自己说：“……算了，我还是想考。”"},
 {id:"f303",n:"志愿表上划掉的那一行",r:3,st:3,t:"她第一志愿本来写的是一个所有人都说“没前途”的专业。划掉的笔迹很重，划了三遍。她说：“没关系啊，我已经知道我想要什么了，这就够了。”——这句话她后来反复用来骗自己。"},
 {id:"f304",n:"教室后排的星星",r:1,st:3,t:"她在课桌下贴了一张星空贴纸，只有低头的时候能看见。她说这样会觉得教室没那么小。"},
 {id:"f305",n:"模考之后的那个电话",r:2,st:3,t:"排名掉了八十名那天她给你打电话，接通之后一句话没说，就那样听着你那边的声音，听了十一分钟才挂。"},
 {id:"f401",n:"第一次一个人坐火车",r:1,st:4,t:"开学那天她坚持一个人走。上车后发了九条消息，最后一条是：“其实我有点害怕，但是不要告诉别人。”"},
 {id:"f402",n:"社团招新的桌子",r:1,st:4,t:"她一口气报了五个社团，最后一个都没坚持下来。她很久以后才承认：不是三分钟热度，是每一个她都想要，而她不知道怎么选。"},
 {id:"f403",n:"被退回来的第一份简历",r:2,st:4,t:"第一份简历石沉大海。她把它打印出来，贴在书桌上，旁边写：“版本1.0，纪念一下。”后来那面墙贴到了版本17。"},
 {id:"f404",n:"宿舍楼下的那次争吵",r:2,st:4,t:"她和室友大吵一架，吵完一个人在楼下坐到十二点。她没哭，她在手机备忘录里写：“我是不是太用力了。”"},
 {id:"f405",n:"她真正想做的那件事",r:3,st:4,t:"大三那年她跟你说了一件她没跟任何人说过的事——她想做的其实一直是那个被划掉的专业。说完她马上补一句“开玩笑的”，然后换了话题。"},
 {id:"f501",n:"第一张工资条",r:1,st:5,t:"到手四千二。她截图发给你，配字三个感叹号。那天晚上她请你吃了一顿八十块的饭，坚持要抢着付。"},
 {id:"f502",n:"厕所隔间的六分钟",r:2,st:5,t:"被领导当众说了之后，她在厕所隔间里待了六分钟。出来补好妆，笑着回工位。那六分钟没人知道，除了你——因为她给你发了一个句号。"},
 {id:"f503",n:"她改了十七版的那个方案",r:2,st:5,t:"第十七版通过的那天，署名栏里没有她。她什么也没说，只是把前十六版存进了一个叫“我自己知道”的文件夹。"},
 {id:"f504",n:"合租房的那盆绿植",r:1,st:5,t:"搬了三次家，那盆绿植一直带着。她说：“它活着，就说明我也还行。”"},
 {id:"f505",n:"凌晨三点的那条语音",r:3,st:5,t:"六十八秒的语音，她只说了一句：“我今天突然想起我七岁的时候说要当主持人。”然后就是很长的呼吸声，直到自动结束。"},
 {id:"f601",n:"三十岁前夜的清单",r:2,st:6,t:"她列了一张清单，题目是《我三十岁之前做到的事》。写了十七条，划掉了九条，最后在最下面加了一条：“认识了一个一直在的人。”"},
 {id:"f602",n:"那个终于没被划掉的选项",r:3,st:6,t:"她最后还是做了那件事——那个十八岁被划掉三遍的方向。她说：“我绕了十二年。但我现在走的是我自己选的路，这一点很重要。”"},
 {id:"f603",n:"她终于敢说的一句",r:3,st:6,t:"“我其实一直很怕，怕自己只是看起来很有活力，其实什么都没做成。”她说完顿了很久，又补上：“但今天我觉得，我好像也还不错。”"}
];

 o:[{tag:"当场用上",tx:"（当场倒了水喝）那从今天起我只用这个。",d:{love:7,mood:6,trust:4,emo:4},r:"（她捂着脸在原地转圈）",f:"f107"},
    {tag:"收好",tx:"真好看，我收起来，舍不得用。",d:{love:2,mood:1},r:"……要用啊。收起来干嘛。"},
    {tag:"心疼钱",tx:"你干嘛花这个钱，攒着不好吗。",d:{love:-6,mood:-6,trust:-4,emo:-4},r:"……对不起。"}]},
{s:1,sc:"该报兴趣班了。宣传单摊了一桌子。",q:"我想学那个！就是期末会上台表演的那个！",
 o:[{tag:"顺她",tx:"那就报这个。上台那天我坐第一排。",d:{mood:6,conf:5,love:4,emo:3,focus:-1,grade:-1},r:"说好了！第一排！不许坐后面！"},
    {tag:"折中",tx:"这个可以报，但我们也挑一个能静下心的，好不好。",d:{focus:5,grade:3,mood:-1,spress:2,eq:2},r:"……那好吧。但是上台那个一定要有。"},
    {tag:"替她决定",tx:"学奥数吧，对升学有用。",d:{grade:5,spress:7,mood:-7,love:-5,trust:-5,conf:-4},r:"……哦。"}]},
{s:1,sc:"家长会结束。老师说她“上课爱接话，影响纪律”。",q:"（她在校门口等你，一直在看你的脸色）",
 o:[{tag:"先认她那一面",tx:"老师说你爱接话。我倒觉得，你是脑子转得比别人快一点。但下次我们举手，行吗。",d:{trust:6,conf:5,eq:4,mood:4,focus:3,emo:3},r:"……行！（她一路蹦回家）"},
    {tag:"如实转达",tx:"老师说你影响纪律，以后注意。",d:{focus:3,mood:-4,conf:-4,trust:-3,emo:-2},r:"知道了。"},
    {tag:"当众数落",tx:"（在校门口当着同学面说了她几句）",d:{mood:-9,trust:-8,love:-7,conf:-7,emo:-7,stress:7},r:"（她一路没说话。当晚也没有）"}]},
{s:1,sc:"她和最好的朋友闹翻了，三天没说话。",q:"是她先不理我的。我才不要先去找她。",
 o:[{tag:"递台阶",tx:"那我们明天带两颗糖，你假装是顺手给的。",d:{eq:6,mood:5,trust:5,emo:4,love:3},r:"……（眼睛亮了）那我带三颗，多的那颗是我的。"},
    {tag:"讲道理",tx:"朋友之间要互相让步，你先去道歉。",d:{mood:-5,trust:-4,eq:-2,emo:-3,stress:4},r:"凭什么是我！"},
    {tag:"不管",tx:"小孩子的事，过两天自己就好了。",d:{trust:-3,love:-3,mood:-2,eq:-1},r:"……哦。"}]},
{s:1,sc:"她被老师当众表扬了一次，一进门就开始演。",q:"老师说！！我的作文！！是全班念得最响的那一篇！！",
 o:[{tag:"配合演出",tx:"那现在请获奖者为我们朗读一遍。（鼓掌）",d:{mood:7,love:5,conf:5,emo:4},r:"（她真的站到沙发上念了一遍，念完还鞠躬）"},
    {tag:"适度",tx:"真不错，继续保持。",d:{mood:1,conf:1},r:"……就这样啊。"},
    {tag:"压一压",tx:"骄傲使人落后。",d:{mood:-7,conf:-6,love:-5,trust:-4,emo:-4},r:"……我知道了。"}]},
{s:1,sc:"晚上九点，她抱着作业本坐在桌前，一个字也没写。",q:"我写不进去。脑子里好多东西在转。",
 o:[{tag:"陪着拆小块",tx:"那我们先只做三道。做完就不许再逼自己了。",d:{focus:6,spress:-5,grade:3,trust:4,mood:3,emo:3},r:"……三道。那我试试。"},
    {tag:"施压",tx:"别找借口，写完才能睡。",d:{grade:3,focus:-3,spress:8,mood:-6,trust:-5,emo:-5,stress:6},r:"（她写到十一点，字越来越潦草）"},
    {tag:"放她走",tx:"那今天不写了，明天再说。",d:{mood:3,spress:-3,focus:-4,grade:-4},r:"耶！（第二天照样没写）"}]},
/* ---------------- 阶段2 · 初中 13–15 ---------------- */
{s:2,sc:"她的房门第一次从里面锁上了。",q:"（隔着门）没事，我就是想自己待会儿。",
 o:[{tag:"尊重这扇门",tx:"好。我在客厅，你想出来随时出来。（没有敲第二次）",d:{trust:6,ident:5,emo:4,stress:-5,mood:3},r:"（一小时后她自己开门了）……谢谢你没一直敲。",f:"f201"},
    {tag:"敲门追问",tx:"你到底怎么了？开门说清楚。",d:{trust:-6,ident:-4,mood:-5,emo:-5,stress:6},r:"我说了没事！"},
    {tag:"拆掉门锁",tx:"这个家不许锁门。",d:{trust:-10,love:-8,ident:-8,emo:-8,stress:10},r:"（她再也没在家里哭过）"}]},
{s:2,sc:"她在镜子前站了四十分钟，换了三套衣服。",q:"……我是不是很丑啊。",
 o:[{tag:"把问题换掉",tx:"你今天这件穿得特别像你。不是好看不好看的问题，是像不像你。",d:{look:-6,ident:5,conf:3,mood:4,love:4,emo:3},r:"……（她又照了一次镜子，这次照得很快）",f:"f202"},
    {tag:"直接否认",tx:"不丑啊，挺好看的。",d:{look:-1,mood:1},r:"你肯定是随便说的。"},
    {tag:"说外貌不重要",tx:"这个年纪别老想这些，把心思放学习上。",d:{look:7,ident:-6,trust:-5,mood:-6,emo:-5,stress:5},r:"……知道了。"}]},
{s:2,sc:"她课本里夹着一封信，写了三页，改了九遍，一直没送出去。",q:"（被你无意看到时她整个人僵住了）你看见了？",
 o:[{tag:"把它还回去",tx:"（把信合上还给她）我什么都没看见。你想说的时候再说。",d:{trust:8,love:6,ident:4,emo:5,stress:-5},r:"……（很久）其实我不是怕他拒绝。我是怕全班都知道我被拒绝了。",f:"f203"},
    {tag:"开玩笑",tx:"哟，小姑娘有心事了。",d:{trust:-5,mood:-5,ident:-4,emo:-4,look:3},r:"你还给我！"},
    {tag:"严肃制止",tx:"这个年纪不能早恋，这封信撕了。",d:{trust:-10,love:-8,ident:-7,emo:-7,stress:9,mood:-8},r:"（她撕了。然后把日记也撕了）"}]},
{s:2,sc:"一个很难听的外号在年级里传了两个月。她每天照常笑着上学。",q:"无所谓啦，他们爱叫就叫呗。",
 o:[{tag:"不拆穿，先站定",tx:"两个月了。你笑了两个月，我也看了两个月。这事我们一起想办法，不用你一个人扛。",d:{trust:8,love:7,ident:6,emo:6,stress:-7,mood:5},r:"（她终于绷不住）……我每天都不想去。",f:"f204"},
    {tag:"教她反击",tx:"下次他们再叫，你就骂回去。",d:{ident:-2,eq:-2,mood:-2,stress:3},r:"……我骂不过他们。"},
    {tag:"信了她的无所谓",tx:"那就好，你心态不错。",d:{trust:-6,emo:-6,ident:-5,stress:7,mood:-5},r:"嗯。（她撕掉了那两个月的日记）"}]},
{s:2,sc:"学校演讲比赛报名表贴出来了。她在公告栏前站了很久，什么也没说。",q:"……反正我也不行。",
 o:[{tag:"轻轻推一把",tx:"你讲话挺好听的。要不要试试？不行也没人会知道。",d:{ident:7,conf:6,mood:5,love:4,emo:4},r:"……（很小声）那我也可以试试吗。",f:"f205"},
    {tag:"替她报名",tx:"（直接帮她报了）",d:{ident:-4,conf:-3,stress:6,mood:-4,trust:-4},r:"你为什么不问我！"},
    {tag:"顺她的话",tx:"那就不报吧，别勉强。",d:{mood:0,ident:-3,conf:-3},r:"……嗯。"}]},
{s:2,sc:"凌晨一点，她房间的台灯又亮了。不是在学习，是在看小说。",q:"（被抓到时她把书塞进被子）",
 o:[{tag:"给她留一块地方",tx:"看完这章就睡。……这本好看吗，回头讲给我听。",d:{trust:6,mood:5,love:4,emo:4,spress:-4,grade:-2},r:"（她眼睛一下亮了）好看！我跟你讲——",f:"f206"},
    {tag:"没收",tx:"（把书收走）现在什么时候了。",d:{trust:-6,mood:-6,emo:-5,spress:4,stress:5,grade:2},r:"……"},
    {tag:"装没看见",tx:"（关上门走了）",d:{trust:2,grade:-3,spress:-1,focus:-2},r:"（第二天她上课睡着了）"}]},
{s:2,sc:"月考后，她的排名掉了三十位。她把成绩单压在书底下。",q:"你别看了，反正就那样。",
 o:[{tag:"先问状态",tx:"分数我一会儿再看。先说你——这阵子是不是很累。",d:{trust:6,emo:5,stress:-6,spress:-5,mood:4,grade:1},r:"……（她点点头，眼泪一下掉下来）"},
    {tag:"分析试卷",tx:"拿来，我们看看丢分在哪。",d:{grade:5,spress:4,trust:1,mood:-3,emo:-2},r:"……哦。"},
    {tag:"拿别人比",tx:"你看人家XX，怎么就能稳住。",d:{ident:-9,mood:-8,trust:-7,love:-6,emo:-7,stress:8,spress:7},r:"那你让XX当你孩子好了。"}]},
{s:2,sc:"她突然把头发剪短了，剪得有点失败。",q:"……很难看吧。你说实话。",
 o:[{tag:"真诚且具体",tx:"侧面有点翘。但你敢一个人去剪这件事，比发型酷多了。",d:{look:-5,ident:6,conf:4,mood:4,love:4},r:"（她笑出声）那我明天就这么去学校。"},
    {tag:"说好看",tx:"好看啊，真的。",d:{look:-1,mood:1,trust:-1},r:"骗人。"},
    {tag:"说实话但只说难看",tx:"确实有点难看，你怎么不先问问我。",d:{look:7,ident:-6,conf:-6,mood:-7,emo:-5},r:"……我就知道。"}]},
{s:2,sc:"她和同学约好周末出去，但那天是你早就定好的家庭安排。",q:"我能不能不去……我真的答应人家了。",
 o:[{tag:"让她去",tx:"去吧。你跟朋友的约定也是约定。",d:{trust:6,love:5,ident:4,mood:5,emo:3},r:"……谢谢。（她回来后主动讲了一路见闻）"},
    {tag:"商量换期",tx:"这次先跟我们走，下周我送你去找她们，好不好。",d:{eq:3,mood:-1,trust:2,emo:1},r:"……行吧。"},
    {tag:"强行要求",tx:"家里的事更重要，推掉。",d:{trust:-7,love:-6,ident:-6,mood:-7,emo:-6,stress:6},r:"（她去了，全程没说话）"}]},
{s:2,sc:"她第一次染了指甲，很淡的颜色，进门就把手背在身后。",q:"（她偷偷观察你的表情）",
 o:[{tag:"看见但不审问",tx:"颜色挑得不错。学校查的话记得提前洗掉。",d:{trust:6,ident:5,look:-4,mood:4,eq:3},r:"……你居然不说我。"},
    {tag:"立刻否定",tx:"学生染什么指甲，去洗了。",d:{trust:-7,ident:-6,look:5,mood:-6,emo:-5},r:"（她洗了。从此什么都不让你看见）"}]},
{s:2,sc:"她在家长群里看到别的家长晒成绩，截图发给你。",q:"你是不是也希望我像她们一样。",
 o:[{tag:"明确回答",tx:"不希望。我要的是你，不是她们的复制品。",d:{ident:8,trust:7,love:6,mood:5,emo:5,stress:-5},r:"……（她把那张截图删了）"},
    {tag:"含糊",tx:"你要是能更努力一点当然更好。",d:{ident:-7,trust:-5,mood:-6,emo:-5,spress:6,stress:5},r:"嗯，我知道了。"}]},
{s:2,sc:"她说她想学画画，但“现在学会不会太晚了”。",q:"我这个年纪再开始，是不是已经来不及了。",
 o:[{tag:"把时间拆开",tx:"来不及成为谁。但来得及成为你自己喜欢的那个样子。先画一张试试。",d:{ident:6,mood:5,conf:4,love:4,emo:3,spress:2},r:"……那我今晚就画一张。"},
    {tag:"讲现实",tx:"现在最重要的是中考，别分心。",d:{ident:-6,mood:-6,conf:-5,spress:6,stress:5,grade:3},r:"……也对。"}]}
];

EV.push(
/* ---------------- 阶段3 · 高中 16–18 ---------------- */
{s:3,sc:"墙上的倒计时牌换到了三位数。你偶然翻到它的背面。",q:"（铅笔字，被橡皮擦淡过）撑住，你以后会很酷的。",
 o:[{tag:"不提，只回应",tx:"（第二天在她桌上留了一张纸条：会的。我见过你很酷的样子。）",d:{conf:7,goal:5,mood:5,love:5,trust:4,emo:4},r:"（她把那张纸条夹进了倒计时牌后面）",f:"f301"},
    {tag:"当面读出来",tx:"你写在背面的那句我看到了，挺好的。",d:{conf:2,mood:-2,trust:-2},r:"……你看我东西干嘛。"}]},
{s:3,sc:"晚上十一点，她突然推开书房的门，眼睛是红的。",q:"我不想考了。真的。我一点都不想了。",
 o:[{tag:"顺着往下聊",tx:"那我们认真聊聊——不考的话，接下来会怎么样。",d:{trust:8,goal:6,spress:-8,emo:6,stress:-7,conf:3},r:"（聊到两点，她自己说）……算了，我还是想考。",f:"f302"},
    {tag:"打气",tx:"坚持一下，就剩这几个月了。",d:{spress:6,mood:-4,trust:-3,emo:-3,stress:4},r:"……嗯。"},
    {tag:"发火",tx:"说什么胡话，这么多年白读了？",d:{trust:-10,love:-9,conf:-8,emo:-8,stress:10,spress:9},r:"（她退出去，关上门）"}]},
{s:3,sc:"志愿表草稿上，第一志愿那行被划了三遍。那是一个所有人都说“没前途”的专业。",q:"没关系啊，我已经知道我想要什么了，这就够了。",
 o:[{tag:"不让她自己劝自己",tx:"那行你划了三遍。划这么重，说明你一点都不觉得没关系。我们把它写回去聊聊。",d:{goal:9,conf:7,trust:7,love:6,emo:5,stress:-5},r:"……（她很久没说话）你是第一个这么说的人。",f:"f303"},
    {tag:"尊重划掉",tx:"你自己想清楚就好。",d:{goal:-3,conf:-3,trust:-1},r:"嗯，想清楚了。"},
    {tag:"赞成划掉",tx:"划得对，那个专业确实不好找工作。",d:{goal:-8,conf:-7,ident:-5,love:-6,emo:-5,stress:5},r:"……嗯。"}]},
{s:3,sc:"她的课桌下贴了一张星空贴纸，只有低头的时候才看得见。",q:"（被发现时她有点不好意思）这样会觉得教室没那么小。",
 o:[{tag:"参与进去",tx:"那下次我给你带一张更大的，贴抽屉里，只有你知道。",d:{mood:6,love:5,conf:3,emo:4,spress:-4},r:"（她笑得很用力）好！",f:"f304"},
    {tag:"提醒规矩",tx:"上课别老低头看这个。",d:{mood:-4,trust:-3,emo:-3,spress:3},r:"……我没有。"}]},
{s:3,sc:"模考排名掉了八十名。她给你打电话，接通之后一句话没说。",q:"（电话那头只有呼吸声）",
 o:[{tag:"陪着不挂",tx:"（也不说话，把手机开着免提，让她听见这边的声音）",d:{trust:9,love:7,emo:7,stress:-8,spress:-6,mood:4},r:"（十一分钟后她挂了。第二天她说：昨天谢谢你）",f:"f305"},
    {tag:"开口追问",tx:"喂？你说话啊，怎么了？",d:{trust:-4,emo:-4,stress:4},r:"……没事。挂了。"},
    {tag:"分析",tx:"掉八十名肯定是哪里出了问题，我们复盘一下。",d:{grade:4,spress:8,trust:-6,emo:-6,stress:7,conf:-5},r:"……好。"}]},
{s:3,sc:"她说她想选文科，家里有人反对。",q:"他们说学文科以后没饭吃。……是不是真的。",
 o:[{tag:"给她判断的工具",tx:"我不知道哪条路更好走。但我们可以一起查清楚，然后你自己选。",d:{goal:7,conf:5,trust:6,eq:4,emo:3},r:"……（她真的查了一晚上）我想好了。"},
    {tag:"替她拍板",tx:"听我的，选理科。",d:{goal:-7,conf:-7,trust:-6,love:-5,emo:-5,stress:6},r:"……哦。"}]},
{s:3,sc:"连着三周没睡够，她在饭桌上发呆，筷子停在半空。",q:"……嗯？你说什么。",
 o:[{tag:"强制休息",tx:"今天晚自习不去了，睡觉。成绩我负责。",d:{spress:-9,stress:-8,emo:6,mood:6,trust:6,grade:-2},r:"……真的可以吗。（她那天睡了十一个小时）"},
    {tag:"心疼但不作为",tx:"你要注意身体啊。",d:{mood:1,spress:1},r:"嗯。"},
    {tag:"加码",tx:"再撑撑，考完就解放了。",d:{spress:8,stress:7,emo:-6,mood:-6,conf:-3},r:"……好。"}]},
{s:3,sc:"她被同学当众指出一个很低级的错误，脸涨得通红。",q:"（回来路上一句话没说）",
 o:[{tag:"先处理面子",tx:"那种场合被点出来，谁都受不了。错本身不大，难受的是当着人。",d:{conf:6,emo:5,trust:6,stress:-6,mood:4},r:"……（她点头）对。就是这个。"},
    {tag:"强调错误",tx:"那个错确实不该犯。",d:{conf:-7,mood:-7,trust:-5,emo:-6,stress:6},r:"我知道了！"}]},
{s:3,sc:"她偷偷报名了一个和学业无关的比赛，被你发现了。",q:"……我知道现在不该搞这些。",
 o:[{tag:"支持但划线",tx:"该搞。给你两周，两周之后我们一起把进度补回来。",d:{goal:6,conf:6,mood:6,love:5,trust:5,spress:2,grade:-2},r:"成交！（她两周后真的补回来了）"},
    {tag:"叫停",tx:"现在什么时候了，退了。",d:{conf:-7,goal:-6,mood:-7,trust:-6,emo:-5,stress:6,grade:2},r:"……退了。"}]},
{s:3,sc:"高考前一周，她突然很平静。",q:"我昨天想明白了。考不好也没关系吧，反正人生很长。",
 o:[{tag:"接住这份平静",tx:"对。而且你这三年不是为了一张卷子活的，这个我作证。",d:{conf:7,emo:6,stress:-7,spress:-7,goal:5,mood:5},r:"（她笑了，是真的松下来的那种笑）"},
    {tag:"警惕",tx:"别想这些，现在松懈就前功尽弃了。",d:{spress:9,stress:8,emo:-7,conf:-6,mood:-6},r:"……好。"}]},
{s:3,sc:"查分那天。她把手机推给你。",q:"你看。我不敢看。",
 o:[{tag:"一起看",tx:"（握着她的手一起点开）不管多少，我们一起看。",d:{trust:8,love:7,emo:6,conf:5,mood:5},r:"（分数出来的一瞬间她先看的是你的表情）"},
    {tag:"替她看",tx:"（自己看完，再决定怎么说）",d:{trust:2,emo:1,conf:-1},r:"……到底多少啊。"}]},
{s:3,sc:"同学群里在互相对答案，她越看越慌。",q:"我那道大题好像做错了……完了。",
 o:[{tag:"切断信息源",tx:"退群。现在改不了了，但你的心情还能改。",d:{spress:-7,stress:-6,emo:5,conf:4,mood:4},r:"……（她真的退了）好像是轻松了一点。"},
    {tag:"陪她对",tx:"我们再核一遍，看看到底错没错。",d:{spress:7,stress:6,emo:-5,mood:-5,grade:1},r:"（对到凌晨三点，更慌了）"}]},
/* ---------------- 阶段4 · 大学 19–22 ---------------- */
{s:4,sc:"开学那天她坚持一个人坐火车。上车后给你发了九条消息。",q:"（第九条）其实我有点害怕，但是不要告诉别人。",
 o:[{tag:"认真对待这句",tx:"收到。这句我替你保密。到站了跟我说一声。",d:{trust:8,love:6,conf:5,social:3,emo:5},r:"……（到站后她发了一张车站照片）我到了。我还行。",f:"f401"},
    {tag:"安慰",tx:"别怕，都这样的。",d:{conf:-1,trust:-1,emo:0},r:"嗯。"},
    {tag:"说她长大了",tx:"这不挺好的吗，终于独立了。",d:{trust:-5,emo:-5,conf:-4,stress:5},r:"……对。挺好的。"}]},
{s:4,sc:"社团招新，她一口气报了五个。",q:"我全都想试！这个也好玩那个也好玩！",
 o:[{tag:"允许她试错",tx:"报吧。两个月后你肯定会退掉三个，那也不丢人。",d:{social:6,mood:6,conf:4,love:4,major:-1,intern:-1},r:"才不会！（两个月后退了四个）",f:"f402"},
    {tag:"先规划",tx:"挑一个能写进简历的就够了。",d:{intern:5,major:3,mood:-5,social:-4,conf:-3,trust:-3},r:"……哦。"},
    {tag:"泼冷水",tx:"你每次都三分钟热度。",d:{conf:-8,mood:-8,ident:-5,love:-7,trust:-6,emo:-6,stress:6},r:"……那我一个都不报了。"}]},
{s:4,sc:"第一份简历投出去，石沉大海。她把它打印出来贴在书桌上。",q:"版本1.0，纪念一下。（她笑着说的）",
 o:[{tag:"陪她做2.0",tx:"那我们今晚做2.0。这面墙我要看见它贴满。",d:{intern:7,conf:6,trust:5,mood:5,emo:4},r:"（那面墙后来贴到了版本17）",f:"f403"},
    {tag:"安慰",tx:"第一次都这样，别灰心。",d:{conf:1,mood:1,intern:0},r:"嗯。"},
    {tag:"找原因",tx:"你这简历确实太空了，没什么能写的。",d:{conf:-8,intern:2,mood:-7,emo:-6,stress:6,love:-5},r:"……我知道。"}]},
{s:4,sc:"她和室友大吵一架，一个人在宿舍楼下坐到十二点。",q:"我是不是太用力了。我是不是对谁都太热情了。",
 o:[{tag:"不否定她的热情",tx:"你不是太用力。你只是把人当回事，而不是每个人都接得住。",d:{social:6,conf:6,ident:5,emo:6,trust:6,stress:-6},r:"……（她哭了）我以为是我有问题。",f:"f404"},
    {tag:"教她收敛",tx:"以后对人别那么掏心掏肺。",d:{social:3,conf:-6,emo:-5,love:-5,mood:-5},r:"……嗯。那我以后注意。"},
    {tag:"劝和",tx:"室友之间忍一忍就过去了。",d:{social:-3,trust:-4,emo:-4,mood:-4},r:"……算了。"}]},
{s:4,sc:"大三的一个深夜，她忽然跟你说了一件没跟任何人说过的事。",q:"我想做的其实一直是那个被划掉的专业。……开玩笑的，当我没说。",
 o:[{tag:"不让她收回去",tx:"不许当没说。你说一次要很大力气，我听见了，而且我记下来了。",d:{major:-2,conf:8,ident:7,trust:9,love:8,emo:7,stress:-6},r:"……（很久）谢谢你没笑我。",f:"f405"},
    {tag:"顺着台阶",tx:"哈哈，那确实是玩笑话。",d:{trust:-7,love:-6,conf:-6,emo:-6,ident:-5},r:"……对吧。哈哈。"},
    {tag:"讲现实",tx:"现在换太晚了，先把眼前的读完。",d:{major:3,conf:-7,ident:-6,trust:-6,emo:-5,stress:5},r:"嗯，我知道。"}]},
{s:4,sc:"她在实习和出国交换之间犹豫，每天换一个答案。",q:"你帮我决定吧，我真的选不出来。",
 o:[{tag:"陪她列，不替她选",tx:"我不替你决定。但我陪你列——两边最坏会怎样，你更受得了哪一个。",d:{major:5,intern:5,conf:6,trust:6,eq:4},r:"……（列完她自己拍板了）"},
    {tag:"替她定",tx:"去实习，实际。",d:{intern:5,conf:-5,trust:-4,major:-3,emo:-3},r:"……好吧。"},
    {tag:"推回去",tx:"你自己的事自己想。",d:{trust:-5,conf:-4,emo:-4,social:-2},r:"……哦。"}]},
{s:4,sc:"她谈了第一段恋爱，对方不太在意她的分享。",q:"他说我讲话太多了。……是不是真的有点烦。",
 o:[{tag:"给她标准",tx:"讲话多不是缺点，那是你这个人。只是他不是能接住的人而已。",d:{conf:7,ident:6,emo:6,trust:6,social:3,stress:-5},r:"……（她那天晚上分手了）"},
    {tag:"劝她改",tx:"你是可以稍微收一点，别人会舒服些。",d:{conf:-7,ident:-6,emo:-5,social:2,love:-5},r:"……哦。那我注意。"}]},
{s:4,sc:"她接了一个没报酬的项目，熬了半个月，成品很好，但没人署她的名。",q:"算了，就当练手。",
 o:[{tag:"替她留证据",tx:"不算了。把过程稿和时间线存下来，这是你的作品集第一页。",d:{intern:7,conf:6,trust:6,work:0,emo:4,mood:4},r:"……对哦。（她建了一个文件夹）"},
    {tag:"附和",tx:"确实，年轻的时候吃点亏是正常的。",d:{conf:-6,intern:-4,trust:-5,emo:-5,stress:5},r:"嗯。"}]},
{s:4,sc:"她在朋友圈发了一条很长的、很用力的动态，发完三分钟就删了。",q:"（她私信你）你看到了吗。我是不是很幼稚。",
 o:[{tag:"把它接住",tx:"看到了，而且我读完了。不幼稚——你只是把真心放在了一个不太安全的地方。放我这儿吧。",d:{ident:7,conf:6,trust:8,love:7,emo:6,stress:-6},r:"……（她把那条原文又发给了你一次）"},
    {tag:"赞同删掉",tx:"删了好，那种话发出去容易被人说。",d:{ident:-6,conf:-5,emo:-5,trust:-5,social:2},r:"……嗯。"}]},
{s:4,sc:"毕业前的最后一次社团演出，她站在了台上。",q:"（谢幕时她在人群里找你）",
 o:[{tag:"让她找到",tx:"（第一排，站起来鼓掌）",d:{conf:8,mood:8,love:7,ident:6,emo:6,social:4},r:"（她在台上红了眼眶，下来第一句是：我看见你了）"},
    {tag:"没能到场",tx:"（临时有事，没去）",d:{conf:-7,mood:-8,love:-8,trust:-6,emo:-6},r:"没关系啦，真的没关系。（她那天的照片一张都没发）"}]},
{s:4,sc:"她第一次因为钱为难——想报一个很贵的课，又开不了口。",q:"……算了，那个课也不是非上不可。",
 o:[{tag:"把难处摊开",tx:"多少钱？我们算算。这件事不丢人，我们一起想办法。",d:{trust:7,love:6,money:0,intern:5,emo:5,conf:4},r:"……（她把价格发过来，手是抖的）"},
    {tag:"直接给钱",tx:"（二话不说转了钱）",d:{love:4,trust:3,conf:-2,intern:3,money:0},r:"……谢谢。（她有点不自在）"},
    {tag:"说太贵",tx:"这么贵？不值吧。",d:{conf:-6,trust:-5,mood:-6,emo:-5,intern:-4},r:"嗯，我也觉得。"}]},
{s:4,sc:"同宿舍的人都拿到了offer，她还没有。",q:"我是不是真的比别人差一点啊。",
 o:[{tag:"把比较移开",tx:"你们投的不是一个赛道。而且我见过你改到第十七版的样子，那个劲儿不会白费。",d:{conf:7,intern:5,emo:6,trust:6,stress:-6,social:3},r:"……（她重新打开了电脑）"},
    {tag:"催她",tx:"那你得抓紧了，别人都定了。",d:{conf:-8,stress:8,emo:-7,mood:-7,intern:2},r:"我知道！"}]}
);

EV.push(
/* ---------------- 阶段5 · 初入职场 23–27 ---------------- */
{s:5,sc:"第一笔工资到账，四千二。她截图发过来，配了三个感叹号。",q:"我自己挣的！！！今晚我请客！",
 o:[{tag:"让她请",tx:"好。我吃最贵的那个，你别拦我。",d:{mood:7,love:6,conf:5,money:1,emo:5},r:"（那顿饭八十块，她抢着付，付完笑了一路）",f:"f501"},
    {tag:"劝她存钱",tx:"刚工作还是存着吧，别乱花。",d:{mood:-6,love:-5,conf:-4,money:3,emo:-4},r:"……也是。那算了。"}]},
{s:5,sc:"被领导当众说了之后，她在厕所隔间待了六分钟，出来补好妆，笑着回了工位。你只收到她一个句号。",q:"。",
 o:[{tag:"读懂那个句号",tx:"六点下班我在楼下。什么都不用说，走一段就行。",d:{resil:7,trust:8,love:7,emo:7,stress:-8,mood:5},r:"（走到第三个路口她才开口）……今天好丢脸啊。",f:"f502"},
    {tag:"问怎么了",tx:"？怎么了",d:{trust:-2,emo:-2},r:"没事，手滑。"},
    {tag:"教她职场规则",tx:"职场就是这样，你要学会不往心里去。",d:{resil:2,trust:-7,love:-6,emo:-6,stress:6,mood:-6},r:"嗯，我知道。"}]},
{s:5,sc:"她改了十七版的方案终于通过了，署名栏里没有她。",q:"无所谓啦，反正东西做出来了。",
 o:[{tag:"不许她无所谓",tx:"有所谓。东西是你做的，这件事至少我们两个要记清楚。那十六版留着。",d:{work:6,resil:6,conf:6,trust:7,emo:6,stress:-5},r:"（她建了一个文件夹，名字叫“我自己知道”）",f:"f503"},
    {tag:"劝她看开",tx:"刚入职都这样，熬熬就好了。",d:{resil:2,conf:-6,trust:-6,emo:-5,stress:6},r:"嗯。"},
    {tag:"让她去争",tx:"你应该直接去找领导说清楚。",d:{resil:-3,work:1,stress:7,emo:-4,social:0,mood:-4},r:"……我不敢。"}]},
{s:5,sc:"第三次搬家，她唯一舍不得扔的是一盆半死不活的绿植。",q:"它活着，就说明我也还行。",
 o:[{tag:"郑重接过",tx:"（帮她抱上车，放在副驾）那它现在是正式乘客了。",d:{mood:6,love:6,emo:5,stress:-5,money:1},r:"（她笑得很用力，眼睛是红的）",f:"f504"},
    {tag:"建议扔掉",tx:"都这样了，到了那边再买一盆呗。",d:{mood:-6,love:-5,emo:-5,trust:-4},r:"……也行。"}]},
{s:5,sc:"凌晨三点，一条六十八秒的语音。",q:"我今天突然想起我七岁的时候说要当主持人。……（然后是很长的呼吸声）",
 o:[{tag:"把那件事接住",tx:"我记得。你说因为主持人说话的时候，所有人都会看着她。那句话我记了二十年。",d:{trust:9,love:9,conf:7,career:0,emo:7,stress:-8,mood:6},r:"……（很久）你怎么还记得。",f:"f505"},
    {tag:"劝她睡",tx:"这么晚了，快睡吧，明天还上班。",d:{trust:-6,love:-6,emo:-6,stress:5},r:"嗯，晚安。"},
    {tag:"鼓励她去做",tx:"那你现在也可以啊，辞职去试试。",d:{resil:-4,stress:6,conf:-3,trust:-2,mood:-3},r:"……说得轻巧。"}]},
{s:5,sc:"她在考虑跳槽，offer薪资高一点，但行业她不喜欢。",q:"钱多一点，但是我一点都不想去。你说我是不是太矫情了。",
 o:[{tag:"把标准交给她",tx:"不矫情。先问你一句：现在这份，是在消耗你，还是在攒你。",d:{work:5,resil:5,career:0,conf:6,trust:6,eq:4},r:"……（她想了三天，自己做了决定）"},
    {tag:"劝她拿钱",tx:"先拿钱，喜欢不喜欢以后再说。",d:{money:6,conf:-6,emo:-5,resil:-4,mood:-5},r:"……也对。"}]},
{s:5,sc:"恋情出了问题。对方说她“情绪太多了”。",q:"是不是我真的太麻烦了。",
 o:[{tag:"分清事实",tx:"你的情绪多，这是真的。但“多”不等于“错”——只等于不是谁都接得住。",d:{rel:6,conf:7,emo:7,trust:7,stress:-6},r:"……（她哭了很久，但是松的那种）"},
    {tag:"劝她收敛",tx:"你确实可以少说一点，对方会轻松些。",d:{rel:-5,conf:-7,emo:-6,trust:-6,stress:6},r:"嗯，我改。"}]},
{s:5,sc:"她连着加了两周班，今天忽然在电话里笑着说了一句很轻的话。",q:"我最近好像不太有感觉了。开心也不太开心，难过也懒得难过。",
 o:[{tag:"当真",tx:"这句不是小事。这周末我过来，什么都不干，先把你捞出来。",d:{resil:5,emo:8,stress:-9,mood:7,trust:7,love:6,work:-2},r:"……好。（她那个周末睡了两天）"},
    {tag:"当成疲劳",tx:"累的吧，睡一觉就好了。",d:{emo:-7,stress:7,mood:-6,trust:-5,resil:-3},r:"嗯，可能吧。"}]},
{s:5,sc:"公司裁员名单传得满天飞，她每天上班前都要深呼吸。",q:"我不怕被裁，我怕被裁的时候别人觉得我活该。",
 o:[{tag:"抓住真正的点",tx:"你怕的不是失业，是被人看笑话。这个我懂。真到那天，我第一个站你这边。",d:{resil:7,money:3,emo:6,trust:8,love:6,stress:-6},r:"……（她没说话，但第二天上班前没再深呼吸）"},
    {tag:"讲现实",tx:"先把手头工作做好，被裁也是实力问题。",d:{work:3,resil:-6,conf:-6,emo:-6,stress:8,trust:-6},r:"嗯。"}]},
{s:5,sc:"她攒了一年的钱，想买一个对她意义很大但并不实用的东西。",q:"我知道这个很不值。但是我真的、真的想要很久了。",
 o:[{tag:"支持这份不值",tx:"你为它攒了一年。那它对你就是值的。买。",d:{mood:8,love:7,conf:5,money:-3,emo:6,accept:0},r:"（她拍下那一刻的截图，存到现在）"},
    {tag:"算账",tx:"这个钱够你交两个月房租了。",d:{money:5,mood:-7,love:-6,conf:-5,emo:-5},r:"……算了，不买了。"}]},
{s:5,sc:"同学聚会上，所有人都在比谁过得更好。她全程很活跃，回家后一个人坐了很久。",q:"我今天笑得脸都僵了。",
 o:[{tag:"点破那个累",tx:"你不用在我这儿继续表演。今天那个场，撑下来已经很累了。",d:{emo:7,stress:-7,trust:7,love:6,accept:0,mood:5,resil:4},r:"……（她把高跟鞋脱了，整个人瘫下去）"},
    {tag:"夸她会来事",tx:"你今天表现挺好的呀，大家都喜欢你。",d:{emo:-5,stress:5,trust:-4,mood:-4},r:"……是吧。"}]},
{s:5,sc:"她第一次带了一个重要的项目，前一晚睡不着。",q:"万一我搞砸了怎么办。所有人都在看。",
 o:[{tag:"给她退路",tx:"搞砸了也有我。但你准备了三周，这事你比谁都熟。",d:{work:6,resil:7,conf:7,stress:-6,emo:5,trust:6},r:"……（她第二天讲得很好）"},
    {tag:"加压",tx:"所以更不能出错，再过一遍流程。",d:{work:4,stress:8,resil:-5,emo:-6,conf:-5,mood:-5},r:"……好。"}]},
/* ---------------- 阶段6 · 稳定抉择 28–30 ---------------- */
{s:6,sc:"三十岁生日前一晚，她列了一张清单：《我三十岁之前做到的事》。",q:"写了十七条，划掉九条。……剩下的八条好像也不怎么样。",
 o:[{tag:"把剩下的念出来",tx:"（一条一条念出来，念完）这八条，是八件别人没替你做的事。",d:{accept:8,career:5,conf:6,love:6,emo:6,mood:6},r:"（她在最下面又加了一条：认识了一个一直在的人）",f:"f601"},
    {tag:"安慰",tx:"三十岁还早呢，以后还有机会。",d:{accept:-3,emo:-3,mood:-3,career:-2},r:"嗯。"},
    {tag:"看划掉的",tx:"那九条为什么没做到？",d:{accept:-7,conf:-6,emo:-6,stress:6,mood:-6},r:"……因为我不行吧。"}]},
{s:6,sc:"她终于开始做那件事了——十八岁那年被划掉三遍的方向。",q:"我绕了十二年。是不是太晚了。",
 o:[{tag:"把十二年算进去",tx:"不晚。而且那十二年不是绕路，是你现在能做好这件事的全部原因。",d:{accept:9,career:8,conf:7,goal:0,emo:6,love:6},r:"……（她很久说不出话）我现在走的是我自己选的路。这一点很重要。",f:"f602"},
    {tag:"提醒风险",tx:"这个年纪换赛道，风险有点大。",d:{accept:-7,career:-7,conf:-6,emo:-5,stress:6,work:2},r:"……我再想想。"}]},
{s:6,sc:"深夜，她忽然说了一句她从来没说过的话。",q:"我其实一直很怕，怕自己只是看起来很有活力，其实什么都没做成。",
 o:[{tag:"不急着反驳",tx:"（没有立刻否认，等她说完）这句你憋了多少年了。",d:{accept:9,trust:9,love:8,emo:8,stress:-8},r:"……（很久）但今天我觉得，我好像也还不错。",f:"f603"},
    {tag:"立刻反驳",tx:"怎么会，你做成了很多事啊！",d:{accept:-4,emo:-3,trust:-3},r:"……嗯，可能吧。"},
    {tag:"附和",tx:"那你确实可以再努力一点。",d:{accept:-10,conf:-8,emo:-8,trust:-7,love:-7,stress:9},r:"……对。"}]},
{s:6,sc:"亲戚饭桌上，有人当着所有人问她为什么还不结婚。",q:"（她笑着打哈哈，桌下的手攥着衣角）",
 o:[{tag:"当场接过话头",tx:"（把话接过去，岔开了）这个我们回头聊，先吃菜。",d:{rel:6,accept:6,love:7,trust:7,emo:6,stress:-6},r:"（回去路上她说）……你刚才那一下，我记一辈子。"},
    {tag:"沉默",tx:"（没出声）",d:{rel:-5,accept:-5,trust:-6,love:-5,emo:-5,stress:5},r:"没事呀，我习惯了。"},
    {tag:"跟着劝",tx:"也是，是该考虑考虑了。",d:{rel:-9,accept:-8,trust:-9,love:-8,emo:-7,stress:8},r:"……嗯。"}]},
{s:6,sc:"她现在的关系很稳定，稳定到有点闷。",q:"他挺好的。就是……我好像很久没有很兴奋过了。",
 o:[{tag:"认真对待这件事",tx:"“挺好”和“想要”是两回事。你不用因为他没有错，就必须留下。",d:{rel:6,accept:7,conf:5,emo:5,trust:6},r:"……（她认真想了很久）"},
    {tag:"劝她知足",tx:"到这个年纪，稳定比兴奋重要。",d:{rel:-6,accept:-7,emo:-6,conf:-5,stress:5},r:"……也是。"}]},
{s:6,sc:"她在事业上遇到瓶颈，连着三个月没有进展。",q:"我是不是就到这儿了。",
 o:[{tag:"把标准换掉",tx:"也可能是你到了一个新的台阶，只是这个台阶要站久一点。",d:{career:7,work:5,accept:6,conf:6,emo:5,stress:-5},r:"……（她重新打开了那个搁置的方案）"},
    {tag:"催",tx:"那你得想办法突破啊，不能一直这样。",d:{career:-6,conf:-6,emo:-6,stress:8,accept:-5},r:"我知道！"}]},

    <rect width="280" height="62" fill="url(#sg)"/>${c.art}</svg>`;
}
function motifOf(txt,stage){
  const t=String(txt||"");
  if(/凌晨|半夜|深夜|台灯|睡不着|夜里|两点|三点|一点/.test(t))return "night";
  if(/台上|演出|汇演|舞台|谢幕|主持|分享|演讲/.test(t))return "stage";
  if(/生日|蛋糕|礼物|清单/.test(t))return "party";
  if(/体检|医院|报告|失眠|药/.test(t))return "clinic";
  if(/操场|跑|运动会|公园|长椅|火车|地铁|街/.test(t))return "out";
  if(/工位|加班|方案|领导|周报|甲方|会议|简历|实习|offer|裁员|署名|同事/i.test(t))return "office";
  if(/教室|老师|同学|班|考|点名|卷子|家长会|学校|课/.test(t))return "school";
  return stage>=5?"office":stage>=4?"out":"home";
}

const ANNIVDAY={14:"child",30:"bday",50:"grad",68:"bday",85:"grad",100:"ny",110:"bday",115:"grad",135:"bday",150:"grad",165:"ny",175:"bday",196:"bday"};

const FX={
 love:{g:[["❤️","💗","💖"],["💕","✨","💛"],["💘","💝","💞"],["🌟","💕","❤️"],["💖","✨","🧡"]],
  p:[["#F2789E","#FFD9E3","#FF6B9D"],["#F5B82E","#FFE9BC","#FF9A52"],["#FF9A52","#FFD3A8","#F2789E"],["#5BA7D9","#D6EAF8","#F2789E"]],
  m:["rise","burst","spiral","corners","wave"],cap:110,base:18,per:5},
 cry:{g:[["💧","😢","💔"],["😭","💧","🥺"],["💧","💧","🌧"],["😞","💧","💧"]],
  p:[["#7D93A8","#C3D4E0","#5B7183"],["#8FA9D4","#C7D6EC","#5A6B8F"],["#9AA5B8","#D3DAE6","#6B7385"]],
  m:["fall","drip","streak","welldown","sink"],vig:1,cap:95,base:15,per:4},
 smile:{g:[["😊","·"],["😊","🙂","·"],["😊","☺","·"]],
  p:[["#F5B82E","#FFF0C4","#E0A24A"],["#4FAE86","#CDEBDC","#8FD3B5"],["#5BA7D9","#D6EAF8","#9CC9E8"]],
  m:["rise","wave","corners"],cap:18,base:9,per:0}};
let fxSeq=0;
function J0(g){let h=0,net=0;
  for(const k in g){if(!IND[k])continue;const rv=IND[k].rev?-1:1;net+=g[k]*rv;if(g[k]*rv<0)h-=g[k]*rv}
  if(net>=4)return{v:1,mag:Math.max(1,net/4)};
  if(net<=-4)return{v:-1,mag:Math.max(1,h/3)};
  return{v:0,mag:1}}
function burst(kind,mag){
  const fx=$("fx");if(!fx)return;const cfg=FX[kind]||FX.smile;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const W=innerWidth,H=innerHeight;
  const gl=PICK(cfg.g),pal=PICK(cfg.p),mode=cfg.m[(fxSeq+++RI(0,2))%cfg.m.length];
  const dens=Math.min(1,Math.max(.4,(W*H)/(1280*800)));
  const n=Math.max(kind==="smile"?6:8,Math.round(Math.min(cfg.cap,cfg.base+mag*cfg.per+R(0,12))*dens));
  if(cfg.vig){const vg=document.createElement("div");vg.className="vig";fx.appendChild(vg);
    const va=vg.animate([{opacity:0},{opacity:1,offset:.25},{opacity:0}],{duration:R(1100,1800),easing:"ease-in-out",fill:"forwards"});
    va.onfinish=()=>vg.remove();setTimeout(()=>vg.remove(),2400)}
  for(let i=0;i<n;i++){
    const el=document.createElement("span");el.textContent=PICK(gl);
    el.style.fontSize=R(kind==="smile"?14:12,kind==="smile"?32:40)*(Math.random()<.12?1.6:1)+"px";
    if(Math.random()<.5){const c=PICK(pal);el.style.color=c;el.style.textShadow="0 0 "+R(5,16)+"px "+c}
    let kf,x,y,dur=R(1400,2900),delay=R(0,kind==="smile"?400:640);
    if(mode==="rise"){x=R(-20,W);y=H+40;const dx=R(-130,130);
      kf=[{transform:`translate(${x}px,${y}px) scale(.4)`,opacity:0},{offset:.12,opacity:1},
          {offset:.6,transform:`translate(${x+dx*.6}px,${y-H*.62}px) rotate(${R(-40,40)}deg) scale(1)`},
          {transform:`translate(${x+dx}px,${y-H-120}px) rotate(${R(-120,120)}deg) scale(.7)`,opacity:0}];}
    else if(mode==="burst"){const cx=W/2,cy=H/2,a=R(0,6.283),d2=R(120,Math.max(W,H)*.78);dur=R(900,1900);
      kf=[{transform:`translate(${cx}px,${cy}px) scale(.2)`,opacity:0},
          {offset:.15,opacity:1,transform:`translate(${cx+Math.cos(a)*d2*.25}px,${cy+Math.sin(a)*d2*.25}px) scale(1.1)`},
          {transform:`translate(${cx+Math.cos(a)*d2}px,${cy+Math.sin(a)*d2+R(0,160)}px) scale(.5) rotate(${R(-200,200)}deg)`,opacity:0}];}
    else if(mode==="spiral"){const cx=W/2,cy=H*.56,a0=R(0,6.283),rr=R(90,Math.min(W,H)*.55),tn=R(1.2,2.4);dur=R(1800,3200);
      kf=[{transform:`translate(${cx}px,${cy}px) scale(.3)`,opacity:0},{offset:.2,opacity:1},
          {transform:`translate(${cx+Math.cos(a0+tn*6.28)*rr}px,${cy+Math.sin(a0+tn*6.28)*rr-H*.35}px) scale(.6) rotate(${R(-220,220)}deg)`,opacity:0}];}
    else if(mode==="corners"){const lf=Math.random()<.5,sx=lf?-30:W+30,sy=H+30,ex=lf?R(W*.3,W):R(0,W*.7);
      kf=[{transform:`translate(${sx}px,${sy}px) scale(.3)`,opacity:0},{offset:.14,opacity:1},
          {transform:`translate(${ex}px,-80px) scale(.6) rotate(${R(-160,160)}deg)`,opacity:0}];}
    else if(mode==="wave"){x=R(0,W);y=H*R(.45,.95);const am=R(40,150);
      kf=[{transform:`translate(${x}px,${y}px) scale(.3)`,opacity:0},
          {offset:.2,opacity:1,transform:`translate(${x+am}px,${y-H*.2}px) scale(1)`},
          {transform:`translate(${x+am*.4}px,-70px) scale(.55) rotate(${R(-140,140)}deg)`,opacity:0}];}
    else if(mode==="fall"){x=R(0,W);y=-50;const dx=R(-40,40);
      kf=[{transform:`translate(${x}px,${y}px) scale(.5)`,opacity:0},{offset:.12,opacity:1},
          {transform:`translate(${x+dx}px,${H+70}px) scale(.8) rotate(${R(-40,40)}deg)`,opacity:0}];}
    else if(mode==="drip"){x=R(W*.2,W*.8);y=-40;dur=R(900,1700);
      kf=[{transform:`translate(${x}px,${y}px) scaleY(.6)`,opacity:0},{offset:.1,opacity:1},
          {transform:`translate(${x+R(-26,26)}px,${H*.95}px) scaleY(.4) scaleX(1.6)`,opacity:0}];}
    else if(mode==="streak"){const dir=Math.random()<.5?1:-1;x=dir>0?R(-120,W*.6):R(W*.4,W+120);y=-60;dur=R(800,1500);
      kf=[{transform:`translate(${x}px,${y}px) rotate(${dir*16}deg) scale(.6)`,opacity:0},{offset:.1,opacity:.95},
          {transform:`translate(${x+dir*R(160,420)}px,${H+80}px) rotate(${dir*16}deg) scale(1)`,opacity:0}];}
    else{x=R(0,W);y=H*R(.2,.6);dur=R(1800,3200);
      kf=[{transform:`translate(${x}px,${y}px) scale(.4)`,opacity:0},{offset:.2,opacity:.9},
          {transform:`translate(${x+R(-50,50)}px,${H+60}px) scale(.7)`,opacity:0}];}
    fx.appendChild(el);
    const an=el.animate(kf,{duration:dur,delay,easing:PICK(["cubic-bezier(.2,.7,.3,1)","ease-out","linear"]),fill:"forwards"});
    an.onfinish=()=>el.remove();setTimeout(()=>el.remove(),dur+delay+400);
  }
}

/* ---------- 状态 ---------- */
function fresh(){return{ph:"name",scr:"plan",nm:"",qi:0,qc:0,qlog:[],qord:null,
 day:1,A:{},money:60,hob:{},frags:[],used:[],usedEnc:[],usedTop:[],slots:[null,null,null],
 risk:0,rlv:0,lines:{},bought:[],pre:{},notes:[],cur:null,run:0,end:null,bonus:0,hl:{}}}
function save(){try{localStorage.setItem("bzd2",JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem("bzd2");return r?JSON.parse(r):null}catch(e){return null}}
function note(t,c){S.notes.push({t,c})}
function notes(){const h=S.notes.map(x=>`<div class="note ${x.t}">${T(x.c)}</div>`).join("");S.notes=[];return h}

function apply(d){const act=stageOf(S.day).ind,out={};
  for(const k in d){if(!act.includes(k))continue;const b=S.A[k];S.A[k]=cl(b+d[k]);out[k]=Math.round((S.A[k]-b)*10)/10}
  return out}
function getFrag(id){
  if(!id||S.frags.includes(id))return;
  const f=FRAG.find(x=>x.id===id);if(!f)return;
  S.frags.push(id);
  note(f.r===3?"p":f.r===2?"y":"b",(f.r===3?"🔶 解锁限定碎片":f.r===2?"🔸 解锁稀有碎片":"🔹 解锁回忆碎片")+"《"+T(f.n)+"》");
  const lv=Math.floor(S.frags.length/6);
  if(lv>S.bonus){S.bonus=lv;["trust","love","eq"].forEach(k=>{if(S.A[k]!=null)S.A[k]=cl(S.A[k]+2)});
    note("g","🔹 碎片收集到 "+S.frags.length+" 块：信任、爱意、情商各永久 +2")}
}
function addHob(n,x){
  if(!n||!x)return;S.hob[n]=(S.hob[n]||0)+x;
  const lv=hobLv(n);
  if(lv>(S.hl[n]||0)){S.hl[n]=lv;
    note("y","⭐ 爱好【"+n+"】升到 "+LVN[lv]+"：解锁「"+HOBSK[n][lv-1]+"」");
    if(lv>=4){apply({conf:4,mood:4,career:0});note("p","✨ "+T("{N}")+"在"+n+"上有了拿得出手的东西，自信心大涨。")}}
}
function hobLv(n){const e=S.hob[n]||0;for(let i=4;i>=0;i--)if(e>=LVEXP[i])return i+1===6?5:i+1;return 1}
function hobLvOf(e){let l=1;for(let i=1;i<5;i++)if(e>=LVEXP[i])l=i+1;return l}
function riskTick(){
  const act=stageOf(S.day).ind;let bad=0;
  act.forEach(k=>{const h=hp(k);if(h<60){S.risk+=(60-h)*0.011;bad++}});
  if(!bad)S.risk=Math.max(0,S.risk-1.2);
  const lv=S.risk>=80?3:S.risk>=50?2:S.risk>=25?1:0;
  if(lv>S.rlv){S.rlv=lv;note("r",["","⚠️ 心理隐患一级："+T("{N}")+"开始睡不好，话变少了。","⚠️ 心理隐患二级：她不再主动分享了。再这样会出事。","⚠️ 心理隐患三级：她已经撑不住了。再不扭转就来不及。"][lv])}
  else if(lv<S.rlv){S.rlv=lv;note("g","🟢 隐患等级回落，她最近气色好了一些。")}
  if(S.risk>=100)return "ill";
  if(S.A.trust<=15||S.A.love<=15)return "cut";
  return null}
function decay(){stageOf(S.day).ind.forEach(k=>{
  if(hp(k)<=62)return;                       // 低于62不再衰减：怠慢拿不到好结局，但不会把她单独推进危险区
  const d=IND[k].p?0.75:1.6;                 // 一天三个时段只够喂三四项，剩下的在回落
  S.A[k]=cl(S.A[k]+(IND[k].rev?d:-d))})}

function curExpr(){const m=S.A.mood||50,e=S.A.emo||50;return(m>=72&&e>=64)?"happy":(m<=46||e<=46)?"sad":"calm"}
function say(q,ex,me){const x=ex||curExpr();
  if(me)return `<div class="say me"><div class="bub">${T(q)}</div></div>`;
  return q?`<div class="say"><span class="ava">${head(stageOf(S.day).k,x)}</span><div class="bub">${T(q)}</div></div>`:""}
function effChips(d,lim){const act=stageOf(S.day).ind;
  return Object.keys(d).filter(k=>IND[k]&&act.includes(k)&&Math.abs(d[k])>=1)
   .sort((a,b)=>Math.abs(d[b])-Math.abs(d[a])).slice(0,lim||4)
   .map(k=>{const good=IND[k].rev?d[k]<0:d[k]>0;
     return `<span class="eff ${good?"u":"d"}">${IND[k].n}${good?"+":"−"}</span>`}).join("")}
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);

function drawStats(){

  const mk=k=>{const v=A[k],h=hp(k),rev=IND[k].rev;

  if(s.t==="act"){const a=ACT[s.i];return a.e+" "+T(a.n)}
  if(s.t==="map"){const m=MAP[stageOf(S.day).k][s.i];return m.e+" "+T(m.n)}
  if(s.t==="chat"){const c=TOPIC[s.i];return c.e+" "+T(c.n)}
  return null}
function firstEmpty(){return S.slots.findIndex(x=>!x)}
function putSlot(o){const i=firstEmpty();if(i<0){alert("今天三个时段都排满了。");return false}S.slots[i]=o;return true}
function slotsHTML(){
  return `<div class="slots">${SLOTN.map((n,i)=>{const l=slotLabel(S.slots[i]);
    return `<div class="slot ${l?"filled":""} ${!l&&firstEmpty()===i?"cur":""}">

  const m=MAP[stageOf(S.day).k][s.i];

  return runEnc(m)}
function runAct(a){

function dayEnd(){
  const st=stageOf(S.day);
  let earn=6+RI(0,4)+(st.k>=4?6:0)+(st.k>=5?9:0);
  S.slots.forEach(s=>{if(s&&s.t==="act"){const a=ACT[s.i];if(a.c==="工")earn+=10}});
  S.money+=earn;note("y","💰 这一天结束，零花钱 +"+earn+"（现在 "+Math.round(S.money)+" 元）");
  const r=riskTick();
  S.running=0;S.slots=[null,null,null];S.scr="plan";
  if(r)return ending(r);
  if(S.day>=200)return finale();
  decay();
  const old=st;S.day++;const nw=stageOf(S.day);
  if(nw.k!==old.k)return stageBreak(old,nw);
  draw()}
function stageBreak(old,nw){
  nw.ind.forEach(k=>{if(S.A[k]!=null)return;
    const hs=old.ind.filter(x=>!IND[x].rev).map(x=>S.A[x]);
    const avg=hs.reduce((a,b)=>a+b,0)/(hs.length||1);
    const seed=cl(avg*0.55+26+RI(-5,5));
    S.A[k]=IND[k].rev?cl(100-seed):seed});
  S.running=0;shell();
  center(`<div class="panel"><div class="phead">阶段结算</div><div class="pbody">
    <h2>${old.n}（${old.a0}–${old.a1}岁）结束了</h2>
    <div class="note y">${T(nw.intro)}</div>
    <div class="grp" style="margin-top:12px">${old.n}最终面板</div>
    <div class="grid">${old.ind.map(k=>{const h=hp(k);
      return `<div class="gc" style="cursor:default"><span class="n">${IND[k].n}</span>
      <span class="d" style="font-size:19px;color:${h>=85?"#2F7A58":h>=70?"#B8860B":h>=60?"#7A6558":"#C9564C"}">${Math.round(S.A[k])}</span></div>`}).join("")}</div>
    ${old.seal.length?`<div class="note b">本阶段专属指标已封存：${old.seal.map(k=>IND[k].n+" "+Math.round(S.A[k])).join("　")}</div>`:""}
    <div class="note p">本阶段碎片 ${FRAG.filter(f=>f.st===old.k&&S.frags.includes(f.id)).length}/${FRAG.filter(f=>f.st===old.k).length}（没拿到的已永久关闭）</div>
    <div class="grp" style="margin-top:12px">进入 ${nw.n} · 新开放指标</div>
    <div class="grid">${nw.ind.filter(k=>!old.ind.includes(k)).map(k=>`<div class="gc" style="cursor:default">
      <span class="n">${IND[k].n} <span class="eff u">新</span></span><span class="d" style="font-size:19px">${Math.round(S.A[k])}</span></div>`).join("")}</div>
    <div class="note g">新地图与新商品已解锁。</div>
    <button class="btn" id="nx">开始 ${nw.n}</button></div></div>`);
  on("nx",draw)}
const GRADE={perfect:["S","完美温情结局"],calm:["A","安稳成长结局"],normal:["B","普通人生结局"],
  burn:["C","内耗疲惫结局"],ill:["D","心理危机结局"],cut:["E","关系决裂结局"]};
function finale(){
  const st=STG[5],hs=st.ind.map(hp);
  if(hs.every(h=>h>=75))return ending("perfect");
  if(hs.every(h=>h>=60))return ending(hs.every(h=>h>=68)?"calm":"normal");
  if(hs.filter(h=>h<60).length<=3&&hs.every(h=>h>=48))return ending("burn");
  return ending("ill")}
function ending(k){
  S.end=k;S.ph="end";S.running=0;
  const e=ENDS[k==="normal"?"calm":k]||ENDS.calm, g=GRADE[k]||GRADE.normal, full=S.frags.length>=FRAG.length;
  const st=STG[5],act=st.ind.filter(x=>S.A[x]!=null);
  const hi=act.slice().sort((a,b)=>hp(b)-hp(a))[0], lo=act.slice().sort((a,b)=>hp(a)-hp(b))[0];
  const topHob=HOBN.filter(n=>S.hob[n]).sort((a,b)=>S.hob[b]-S.hob[a])[0];
  const kw={事业:hp("career")>=75?"做着自己选的事":hp("work")>=70?"稳住了，但谈不上热爱":"一直在将就",
    感情:hp("rel")>=75?"有人接得住她":hp("rel")>=60?"平稳，偶尔孤单":"还在一个人扛",
    性格:hp("accept")>=75?"舒展、接纳自己":hp("accept")>=60?"大致和解了":"仍然在跟自己较劲",
    关系:hp("trust")>=80&&hp("love")>=80?"你是她唯一不设防的人":hp("trust")>=60?"长久但有距离":"已经疏远"};
  document.body.innerHTML=`<div id="fx" aria-hidden="true"></div><div class="wrap"><div id="endwrap"></div></div>`;
  $("endwrap").innerHTML=`<div class="panel fade" style="margin-top:22px"><div class="pbody" style="text-align:center">
    <div class="gradebox"><div class="grade ${g[0]}">${g[0]}</div>
      <div style="text-align:left"><div style="font-size:12px;color:#A7948A">最终年龄 30 岁 · 第 200 天</div>
      <h2 style="margin:2px 0 0">${g[1]}</h2><div style="color:#7A6558">${T(e.t)}</div></div></div>
    ${portrait(6,k==="perfect"||k==="calm"?"happy":k==="ill"||k==="cut"?"sad":"calm",120)}
    <div class="kw">${Object.keys(kw).map(x=>`<div class="kwc"><div class="k">${x}</div><div class="v">${kw[x]}</div></div>`).join("")}</div>
    ${e.p.map(x=>`<p style="text-align:left;color:#7A6558;margin:10px 0 0">${T(x)}</p>`).join("")}
    <div class="fin">${T(e.f)}</div>
    ${k==="perfect"&&full?`<div class="note p" style="text-align:left">🔶 全碎片收集完成，解锁隐藏后记</div>
      <h2 style="margin-top:18px">${T(AFTER.t)}</h2>
      ${AFTER.p.map(x=>`<p style="text-align:left;color:#7A6558">${T(x)}</p>`).join("")}
      <div class="fin">${T(AFTER.f)}</div>`:""}
    <div class="grp" style="margin-top:18px">终章数据</div>
    <div class="grid">
      <div class="gc" style="cursor:default"><span class="n">最高属性</span><span class="d">${IND[hi].n} ${Math.round(S.A[hi])}</span></div>
      <div class="gc" style="cursor:default"><span class="n">最低属性</span><span class="d">${IND[lo].n} ${Math.round(S.A[lo])}</span></div>
      <div class="gc" style="cursor:default"><span class="n">回忆碎片</span><span class="d">${S.frags.length} / ${FRAG.length}</span></div>
      <div class="gc" style="cursor:default"><span class="n">最高爱好</span><span class="d">${topHob?topHob+" "+LVN[hobLvOf(S.hob[topHob])]:"没有发展起来"}</span></div>
      <div class="gc" style="cursor:default"><span class="n">隐藏剧情</span><span class="d">${[1,2,3,4,5,6].filter(i=>S.lines[i]).length} / 6</span></div>
      <div class="gc" style="cursor:default"><span class="n">心理隐患</span><span class="d">${Math.round(S.risk)} / 100</span></div>
    </div>
    <div class="row" style="justify-content:center"><button class="btn" id="again">再陪她长大一次</button></div>
  </div></div>`;
  burst(k==="perfect"||k==="calm"?"love":k==="ill"||k==="cut"?"cry":"smile",8);
  on("again",()=>{try{localStorage.removeItem("bzd2")}catch(e){}location.reload()})}

/* ================= 开场 ================= */
function nameScreen(){
  S.ph="name";draw();
  center(`<div class="panel"><div class="pbody">
    <h1><small>陪伴养成 · 7岁 → 30岁 · 200天</small>伴<span style="color:#F2789E">她</span>长大</h1>
    <p class="lede">这是一个陪一个女孩从七岁走到三十岁的养成游戏。她狮子座、ENFP：热情、话多、想象力旺盛，要强又爱面子；共情力强，也很容易内耗。</p>
    <p class="lede" style="margin-top:10px">先给她取个名字。之后所有剧情、对话、碎片故事都会用这个名字。</p>
    <div class="nameform"><input id="nm" maxlength="8" placeholder="输入她的名字" autocomplete="off">
      <button class="btn" id="go">就叫这个名字</button></div>
    <p class="hint">不填默认叫「SC」。最多 8 个字。</p>
    <details><summary>玩法速览</summary><ul>
      <li><b>每天三个时段</b>（上午/下午/晚上），自由安排学习、休息、社交、才艺、打工，或者带她外出探索、陪她聊天。</li>
      <li><b>零花钱与商店</b>：每天结束有收入，可以买零食、文创、礼物、门票。送礼投其所好大幅加分，送习题册她会沉默。</li>
      <li><b>爱好等级 L1–L5</b>：反复安排同一类才艺会积累经验，L4 起触发高光剧情。</li>
      <li><b>六个阶段各有独立指标</b>，专属指标升学后封存；信任、爱意、情商、心理压力永久继承。</li>
      <li>任一指标长期低于 60 会累积<b>心理隐患</b>；信任或爱意跌穿则直接决裂。</li>
      <li><b>31 块回忆碎片</b>，限定碎片过了年龄段永久关闭；集齐解锁隐藏后记。</li>
      <li>结局分 <b>S / A / B / C / D / E</b> 六档。</li>
    </ul></details>
  </div></div>`);
  const i=$("nm");if(i)i.focus();
  const go=()=>{S.nm=(($("nm")||{}).value||"").trim()||"SC";
    try{$("gname").textContent="伴"+S.nm+"长大"}catch(e){}
    S.ph="quiz";quiz()};
  on("go",go);if(i)i.onkeydown=e=>{if(e.key==="Enter")go()}}
function quiz(){
  draw();
  if(!S.qord||S.qord.length!==QUIZ.length)S.qord=QUIZ.map(q=>shuf(q.o.length));
  const Q=QUIZ[S.qi],od=S.qord[S.qi];
  center(`<div class="panel"><div class="pbody">
    <span class="qnum">开局摸底 · 第 ${S.qi+1} / 8 题</span>
    <div class="qtxt">${T(Q.q)}</div>
    <div class="opts">${od.map((oi,i)=>`<button class="opt" data-i="${oi}"><span class="k">${"ABCD"[i]}</span><span class="tx">${T(Q.o[oi])}</span></button>`).join("")}</div>
    <div class="prog">${QUIZ.map((_,i)=>`<i class="${i<=S.qi?"on":""}"></i>`).join("")}</div>
  </div></div>`);
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,ok=i===Q.a;S.qlog.push(ok);if(ok)S.qc++;
    S.qi++;S.qi<8?quiz():quizEnd()})}
function quizEnd(){
  const base=Math.max(35,Math.min(72,55+S.qc*3-(8-S.qc)*2));
  STG[0].ind.forEach(k=>{S.A[k]=IND[k].rev?cl(100-base):cl(base+RI(-3,3))});
  S.A.love=cl(Math.min(base,50));
  S.money=40+S.qc*8;
  if(S.qc>=6){S.hob["画画"]=30;S.hob["表演"]=30;S.hl["画画"]=1;S.hl["表演"]=1}
  else if(S.qc>=3){S.hob["画画"]=20;S.hl["画画"]=1}
  S.ph="day";S.day=1;S.scr="plan";
  const word=S.qc>=7?"你几乎全中。你是真的看得见她。":S.qc>=5?"你大致懂她。剩下的，二十三年里慢慢补。":
    S.qc>=3?"你只摸到了她的外壳。她很多话不会直说。":"你几乎不了解她。这二十三年会走得很吃力。";
  shell();
  center(`<div class="panel"><div class="pbody">
    <h2>摸底结果：答对 ${S.qc} / 8</h2>
    <p class="lede">${word}</p>
    <div class="grp" style="margin-top:12px">答案</div>
    <ul style="color:#7A6558;font-size:13px;line-height:1.95;padding-left:18px">
      ${QUIZ.map((q,i)=>`<li>${S.qlog[i]?"<span class='up'>✓</span>":"<span class='dn'>✗</span>"} ${T(QEXP[i])}</li>`).join("")}</ul>
    <div class="grp" style="margin-top:12px">小学阶段 · 初始面板</div>
    <div class="grid">${STG[0].ind.map(k=>`<div class="gc" style="cursor:default">
      <span class="n">${IND[k].n}</span><span class="d" style="font-size:19px">${Math.round(S.A[k])}</span></div>`).join("")}</div>
    <div class="note y">初始零花钱 ${S.money} 元${Object.keys(S.hob).length?"　｜　初始爱好倾向："+Object.keys(S.hob).join("、"):""}</div>
    ${say("（她抬头看你，书包带滑到了胳膊肘）<br>你是来接我的吗？<br>……那我跟你说，我今天在学校画了一张画！","happy")}
    <button class="btn" id="go">开始第 1 天</button></div></div>`);
  on("go",()=>{S.scr="plan";draw()})}
function reset(){try{localStorage.removeItem("bzd2")}catch(e){}S=fresh();nameScreen()}
function boot(){
  S=load()||fresh();
  if(!S.A||!S.slots)S=fresh();
  S.notes=S.notes||[];S.running=0;
  try{if(S.nm)$("gname").textContent="伴"+S.nm+"长大"}catch(e){}
  if(S.ph==="end"&&S.end)return ending(S.end);
  if(S.ph==="quiz")return quiz();
  if(S.ph==="day"){S.scr=S.scr||"plan";return draw()}
  nameScreen()}
$("restart").onclick=()=>{if(confirm("重新开始？当前进度会被清空。"))reset()};
try{if(localStorage.getItem("bzd2"))$("savenote").textContent="· 进度自动保存在本机";}catch(e){}
boot();
</script>
</body>
